version: '3.8'

services:
  # PostgreSQL Database with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docintel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Store for Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: docintel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Python Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PORT: 5000
      SECRET_KEY: docintel-prod-secret-key-super-secure-384920
      JWT_SECRET_KEY: docintel-jwt-secret-key-ultra-secure-938490
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/docintel_db
      UPLOAD_FOLDER: storage/uploads
      PROCESSED_FOLDER: storage/processed
      AI_PROVIDER: fallback
      EMBEDDING_PROVIDER: fallback
      LLM_PROVIDER: fallback
    ports:
      - "5000:5000"
    volumes:
      - backend_storage:/app/storage

  # React Frontend Single Page App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docintel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  backend_storage:
